    <!-- Launch screen on every load: plain HTML so it shows on the first paint, before any script. -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #f8fafc; pointer-events: none; transition: opacity 0.35s ease, transform 0.35s ease; }
      html.dark #splash { background: #020617; }
      #splash .logo { width: 96px; height: 96px; filter: drop-shadow(0 16px 28px rgba(28, 83, 168, 0.3)); animation: splash-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      #splash .name { font: 800 28px/1 "Plus Jakarta Sans Variable", ui-sans-serif, system-ui, -apple-system, sans-serif; letter-spacing: -0.02em; color: #0f172a; animation: splash-up 0.5s 0.15s ease-out both; }
      html.dark #splash .name { color: #f1f5f9; }
      #splash .bar { width: 96px; height: 4px; border-radius: 2px; overflow: hidden; background: rgba(47, 135, 245, 0.15); animation: splash-up 0.5s 0.3s ease-out both; }
      #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 2px; background: #2f87f5; animation: splash-run 1s ease-in-out infinite; }
      #splash.out { opacity: 0; transform: scale(1.04); }
      @keyframes splash-in { from { opacity: 0; transform: scale(0.8); } }
      @keyframes splash-up { from { opacity: 0; transform: translateY(8px); } }
      @keyframes splash-run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #splash, #splash * { animation: none !important; } #splash.out { transform: none; } }
    </style>
